<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lección 2 de euskera. Pedí un talo en la feria, elegí los ingredientes y, al final, decidí lo de la mayonesa.">
<title>Taloa!</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Lección 2. Misma idea que Mendira!: un fondo pixel art, tarjetas tipo RPG abajo.
     Acá el talo se queda arriba y se va llenando con lo que le decís "Bai". */
  :root {
    --bg: #c9b48a;
    --fg: #2a2520;
    --muted: #6b625a;
    --card: rgba(255, 250, 240, 0.94);
    --card-edge: #3b2f24;
    --accent: #c8402f;      /* rojo de ikurriña, apagado */
    --accent-ink: #fff6f2;
    --basque: #2e7d4f;      /* verde de ikurriña */
    --display: "Pixelify Sans", "Trebuchet MS", "Segoe UI", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --fade: 900ms;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: 50% 50%;
    opacity: 0;
    transition: opacity var(--fade) ease;
  }
  .bg.on { opacity: 1; }

  /* El cartel de la barra está vacío en el fondo; el texto va encima, con la fuente del título */
  #letrero {
    position: fixed; z-index: 1; pointer-events: none;
    font-family: var(--display); font-weight: 700; line-height: 1;
    color: #f1dfb6; text-shadow: 0 2px 0 #2a1a10;
    letter-spacing: 0.06em; white-space: nowrap;
    display: grid; place-items: center;
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity var(--fade) ease;
  }
  #letrero.on { opacity: 1; }

  #stage {
    position: relative; z-index: 3;
    height: 100%;
    display: grid;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px;
    box-sizing: border-box;
  }
  .scene {
    width: min(100%, 520px);
    justify-self: center;
    align-self: end;
    display: grid; gap: 12px; justify-items: center;
    animation: rise 480ms cubic-bezier(.2,.8,.2,1) both;
  }
  .scene.center { align-self: center; text-align: center; }
  .scene.top { align-self: start; text-align: center; padding-top: 4vh; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* Cuadro de diálogo */
  .card {
    width: 100%; box-sizing: border-box;
    background: var(--card);
    border: 3px solid var(--card-edge);
    border-radius: 8px;
    box-shadow: 0 0 0 3px rgba(255,250,240,0.85), 0 14px 30px -14px rgba(0,0,0,0.55);
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 6px 18px;
    align-items: center;
  }
  .card.solo { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .card .pic {
    grid-row: 1 / span 4;
    width: 112px; height: 112px; object-fit: contain;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.25));
    animation: pop 500ms 120ms cubic-bezier(.3,1.5,.5,1) both;
  }
  .card .pic.gone { visibility: hidden; }
  @keyframes pop { from { opacity: 0; transform: scale(0.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
  .counter {
    font-family: var(--display); font-size: 0.85rem; letter-spacing: 0.08em;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .eu {
    font-family: var(--display); font-weight: 700;
    font-size: 2.1rem; line-height: 1; color: var(--fg); text-wrap: balance;
  }
  .es { font-weight: 700; color: var(--basque); font-size: 1.05rem; }
  .note { margin: 0; color: var(--muted); text-wrap: pretty; max-width: 36ch; }
  .note.lead { color: var(--fg); font-size: 1.1rem; }
  .card > .btn, .card > .choices, .card > .links { grid-column: 1 / -1; justify-self: center; margin-top: 6px; }
  .choices { display: flex; gap: 14px; }

  @media (max-width: 440px) {
    .card { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 4px; padding: 14px 16px; }
    .card .pic { grid-row: auto; width: 96px; height: 96px; }
    .eu { font-size: 1.8rem; }
    .note { max-width: none; }
  }

  h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(3.4rem, 15vw, 5.4rem); line-height: 0.95; margin: 0;
    color: #fffaf0;
    text-shadow: 0 3px 0 #3b2f24, 0 0 24px rgba(0,0,0,0.35);
    letter-spacing: 0.01em;
  }
  .sub {
    margin: 0; font-family: var(--display); font-size: 1.3rem; color: #fffaf0;
    text-shadow: 0 2px 0 #3b2f24;
  }
  .sub small { display: block; font-family: var(--body); font-size: 1rem; margin-top: 4px; opacity: 0.95; }

  .btn {
    font: 700 1.05rem var(--body);
    background: var(--accent); color: var(--accent-ink);
    border: 3px solid var(--card-edge); border-radius: 8px;
    padding: 12px 24px; cursor: pointer;
    box-shadow: 0 4px 0 var(--card-edge);
    transition: transform 100ms ease, box-shadow 100ms ease;
    text-decoration: none; display: inline-block;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .btn.bai { background: var(--basque); min-width: 96px; }
  .btn.ez  { background: var(--accent); min-width: 96px; }
  .btn[disabled] { opacity: 0.6; cursor: default; }

  /* El "Ez" que se escapa: pasa a flotar y va a donde quiere */
  .btn.ez.loose {
    position: fixed; z-index: 20; margin: 0;
    transition: left 220ms cubic-bezier(.2,.8,.2,1), top 220ms cubic-bezier(.2,.8,.2,1), transform 300ms;
  }
  .btn.ez.loose.small { transform: scale(0.72); }
  .btn.ez.loose.tiny  { transform: scale(0.55); }

  .links { font-size: 0.9rem; }
  .links a { color: var(--muted); }

  /* El talo, arriba, con sus ingredientes adentro */
  #talo {
    position: fixed; z-index: 2; pointer-events: none;
    left: 50%; top: max(24vh, env(safe-area-inset-top, 0px));
    width: min(74vw, 340px, 34vh * 831 / 520);
    aspect-ratio: 831 / 520;
    transform: translateX(-50%);
    opacity: 0; transition: opacity 600ms;
    filter: drop-shadow(0 12px 14px rgba(0,0,0,0.4));
  }
  #talo.on { opacity: 1; }
  #talo.bump { animation: bump 420ms cubic-bezier(.3,1.6,.4,1); }
  @keyframes bump { 30% { transform: translateX(-50%) scale(1.07) translateY(-3%); } 100% { transform: translateX(-50%); } }
  #talo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* La tapa de adelante del talo, recortada: queda por encima de los ingredientes para que parezcan adentro */
  #talo > .front {
    clip-path: polygon(0 62%, 4% 59%, 18% 52%, 30% 47.5%, 42% 45.2%, 54% 45.2%, 66% 46.5%, 78% 49.8%, 89% 55.4%, 96% 60%, 100% 62.5%, 100% 100%, 0 100%);
  }
  #talo .fill { position: absolute; inset: 0; }
  #talo .fill img {
    position: absolute; left: 50%; bottom: 42%;
    transform: translateX(-50%);
    width: 60%; height: auto;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }
  #talo .splash {
    opacity: 0; z-index: 3;
    /* más chico y sobre la boca del talo, encima de lo que haya adentro */
    inset: auto; left: 50%; bottom: 40%; width: 52%; height: auto;
    transform: translateX(-50%);
    transform-origin: 50% 80%;
  }
  #talo .splash.on { animation: splat 520ms cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes splat { from { opacity: 0; transform: translateX(-50%) scale(0.2); } 60% { opacity: 1; transform: translateX(-50%) scale(1.12); } to { opacity: 1; transform: translateX(-50%); } }

  /* Cosas que vuelan de la tarjeta al talo */
  .flyer {
    position: fixed; z-index: 10; pointer-events: none;
    object-fit: contain;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.35));
    transition: left 650ms cubic-bezier(.3,.9,.4,1), top 650ms cubic-bezier(.5,-0.3,.5,1), width 650ms ease, height 650ms ease, transform 650ms ease;
  }

  .hint {
    margin: 0; font-family: var(--display); font-size: 0.9rem; letter-spacing: 0.06em;
    color: #fffaf0; text-shadow: 0 2px 0 #3b2f24, 0 0 10px rgba(0,0,0,0.4);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.55 } 50% { opacity: 1 } }

  /* La notificación, como si le llegara al celular */
  #notif {
    position: fixed; z-index: 30;
    top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%;
    width: min(92vw, 420px);
    transform: translate(-50%, -140%);
    transition: transform 520ms cubic-bezier(.2,.9,.3,1.1);
    background: rgba(250, 250, 250, 0.96);
    color: #111;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    padding: 12px 14px;
    display: grid; grid-template-columns: 40px 1fr auto; gap: 4px 12px; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, var(--body);
    font-size: 15px; line-height: 1.3;
  }
  #notif.on { transform: translate(-50%, 0); }
  #notif .avatar {
    grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 50%;
    background: #25d366; color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 18px;
  }
  #notif .who { font-weight: 700; }
  #notif .when { color: #777; font-size: 13px; justify-self: end; }
  #notif .msg { grid-column: 2 / span 2; }

  .finale .eu { font-size: 2.2rem; }
  .remate {
    font-family: var(--display); font-weight: 700; font-size: 1.3rem;
    color: var(--accent); margin: 2px 0 0;
    animation: popin 400ms 900ms both;
  }
  @keyframes popin { from { opacity: 0; transform: translateY(8px) scale(0.9); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div id="letrero" aria-hidden="true">TALOAK</div>

<div id="talo" aria-hidden="true">
  <img class="base" src="assets/taloa.png" alt="">
  <div class="fill"></div>
  <img class="front" src="assets/taloa.png" alt="">
  <img class="splash" src="assets/maionesa-splash.png" alt="">
</div>

<div id="notif" role="status">
  <div class="avatar">N</div>
  <div class="who">Nagore</div>
  <div class="when">ahora</div>
  <div class="msg">Es duro…</div>
</div>

<main id="stage" aria-live="polite"></main>

<script>
(function () {
  const stage = document.getElementById('stage');
  const talo = document.getElementById('talo');
  const fill = talo.querySelector('.fill');
  const splash = talo.querySelector('.splash');
  const notif = document.getElementById('notif');
  const bgs = [document.getElementById('bgA'), document.getElementById('bgB')];
  let bgIdx = 0, currentBg = '';

  const IMG = {
    azoka: 'assets/azoka.jpg',
    barra: 'assets/barra.jpg',
    maionesa: 'assets/maionesa.png',
  };

  // La carta. "w" es el ancho del ingrediente dentro del talo, en proporción al talo.
  const carta = [
    { pic: 'assets/txistorra.png',    eu: 'Txistorra',    es: 'Chistorra.', note: 'No es salchicha. No es chorizo.', w: 0.80 },
    { pic: 'assets/txorizoa-osoa.png',     eu: 'Txorizoa',     es: 'Chorizo.',   note: 'No es lo mismo que txistorra.', w: 0.74 },
    { pic: 'assets/hirugiharra.png',  eu: 'Hirugiharra',  es: 'Panceta.',   note: 'Imposible decirlo tres veces seguidas.', w: 0.70 },
    { pic: 'assets/solomoa.png',      eu: 'Solomoa',      es: 'Lomo.',      note: 'Para los que no se animan a la txistorra.', w: 0.60 },
    { pic: 'assets/gazta.png',        eu: 'Gazta',        es: 'Queso.',     note: 'En lo posible, de oveja.', w: 0.64 },
    { pic: 'assets/txokolatea.png',   eu: 'Txokolatea',   es: 'Chocolate.', note: 'Sí, es tradición. Pero va solo.', solo: true, w: 0.66 },
  ];
  // Escenas: 0 tapa, 1 intro, 2..7 la carta, 8 maionesa, 9 final
  const MAIO = 2 + carta.length;
  const FINAL = MAIO + 1;
  let step = 0, busy = false, puestos = 0, conTxokolatea = false;

  // ---- fondo con fundido ----
  function setBg(key) {
    if (key === currentBg) return;
    currentBg = key;
    bgIdx = 1 - bgIdx;
    const next = bgs[bgIdx], prev = bgs[1 - bgIdx];
    next.style.backgroundImage = `url("${IMG[key]}")`;
    next.classList.add('on'); prev.classList.remove('on');
    placeLetrero();
  }

  // ---- el cartel de la barra (misma matemática que background-size: cover) ----
  // El fondo de la feria mide 768x1376; el cartel de madera va de (259,830) a (480,887).
  const AZOKA = { w: 768, h: 1376, px: 0.5, py: 0.5, cartel: { cx: 370, cy: 858, w: 221, h: 57 } };
  const letrero = document.getElementById('letrero');
  function placeLetrero() {
    if (currentBg !== 'azoka') { letrero.classList.remove('on'); return; }
    const W = window.innerWidth, H = window.innerHeight;
    const sc = Math.max(W / AZOKA.w, H / AZOKA.h);
    const offX = (W - AZOKA.w * sc) * AZOKA.px;
    const offY = (H - AZOKA.h * sc) * AZOKA.py;
    const c = AZOKA.cartel;
    letrero.style.left = (offX + c.cx * sc) + 'px';
    letrero.style.top = (offY + c.cy * sc) + 'px';
    letrero.style.width = (c.w * sc) + 'px';
    letrero.style.height = (c.h * sc) + 'px';
    letrero.style.fontSize = Math.round(c.h * sc * 0.62) + 'px';
    letrero.classList.add('on');
  }
  window.addEventListener('resize', placeLetrero);

  // ---- sonidos sintetizados con Web Audio, sin archivos ----
  let ctx = null;
  function audio() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }
  function ploc() { // cae algo blando sobre el talo
    const c = audio(); if (!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(220, t0);
    osc.frequency.exponentialRampToValueAtTime(70, t0 + 0.14);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    osc.connect(g).connect(c.destination);
    osc.start(t0); osc.stop(t0 + 0.2);
  }
  function bip() { // el botón que se escapa
    const c = audio(); if (!c) return;
    const t0 = c.currentTime;
    const osc = c.createOscillator(); osc.type = 'square';
    osc.frequency.setValueAtTime(520, t0);
    osc.frequency.exponentialRampToValueAtTime(900, t0 + 0.07);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    osc.connect(g).connect(c.destination);
    osc.start(t0); osc.stop(t0 + 0.1);
  }
  function splashSound() { // ruido filtrado que cae, más un golpe grave
    const c = audio(); if (!c) return;
    const t0 = c.currentTime, dur = 0.55;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6);
    const src = c.createBufferSource(); src.buffer = buf;
    const filt = c.createBiquadFilter(); filt.type = 'lowpass';
    filt.frequency.setValueAtTime(3800, t0);
    filt.frequency.exponentialRampToValueAtTime(300, t0 + dur);
    const g = c.createGain(); g.gain.value = 0.45;
    src.connect(filt).connect(g).connect(c.destination);
    src.start(t0);
    const osc = c.createOscillator(); osc.type = 'sine';
    osc.frequency.setValueAtTime(160, t0);
    osc.frequency.exponentialRampToValueAtTime(45, t0 + 0.3);
    const g2 = c.createGain();
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.6, t0 + 0.015);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    osc.connect(g2).connect(c.destination);
    osc.start(t0); osc.stop(t0 + 0.4);
  }
  function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  // ---- escenas ----
  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function img(src, cls) { const i = el('img', cls); i.src = src; i.alt = ''; return i; }
  function button(label, onClick, cls) {
    const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button';
    b.addEventListener('click', (e) => { e.stopPropagation(); onClick(b); });
    return b;
  }

  // Algo de la tarjeta vuela hasta un lugar del talo (en proporciones del talo) y después se hace lo que sigue.
  function volar(fromImg, dst, extra, done) {
    const r0 = fromImg.getBoundingClientRect();
    const t = talo.getBoundingClientRect();
    const f = img(fromImg.src, 'flyer');
    f.style.left = r0.left + 'px'; f.style.top = r0.top + 'px';
    f.style.width = r0.width + 'px'; f.style.height = r0.height + 'px';
    document.body.appendChild(f);
    fromImg.classList.add('gone');
    const w = t.width * dst.w, h = w * (fromImg.naturalHeight / fromImg.naturalWidth || 0.4);
    const cx = t.left + t.width * dst.cx, by = t.top + t.height * dst.bottom;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      f.style.left = (cx - w / 2) + 'px'; f.style.top = (by - h) + 'px';
      f.style.width = w + 'px'; f.style.height = h + 'px';
      if (extra) f.style.transform = extra;
    }));
    setTimeout(() => { f.remove(); done(); }, 680);
  }

  function ponerIngrediente(o, idx) {
    if (o.solo) conTxokolatea = true; // al de chocolate no se le pone mayonesa, ni vos
    const i = img(o.pic);
    const dx = [0, -0.09, 0.09, -0.04, 0.05, 0][idx % 6];
    i.style.width = (o.w * 100) + '%';
    i.style.left = (50 + dx * 100) + '%';
    i.style.bottom = (42 + idx * 3) + '%';
    fill.appendChild(i);
    talo.classList.remove('bump'); void talo.offsetWidth; talo.classList.add('bump');
    ploc();
    vibra(40);
  }

  function render() {
    stage.innerHTML = '';
    const scene = el('div', 'scene');
    stage.appendChild(scene);
    talo.classList.toggle('on', step >= 2);

    if (step === 0) {
      setBg('azoka');
      scene.classList.add('top');
      scene.appendChild(el('h1', null, 'Taloa!'));
      scene.appendChild(el('p', 'sub', '¡Un talo!<small>Lección 2 de euskera: con las manos en la masa</small>'));
      scene.appendChild(button('Pedir un talo', () => { audio(); next(); }));
    }
    else if (step === 1) {
      setBg('azoka');
      scene.classList.add('center');
      const card = el('div', 'card solo');
      card.appendChild(el('div', 'eu', 'Zer nahi duzu?'));
      card.appendChild(el('div', 'es', '¿Qué querés?'));
      card.appendChild(el('p', 'note', 'Armalo a tu gusto. A cada cosa de la carta le decís <b>Bai</b> o <b>Ez</b>, y cada una te enseña una palabra.'));
      card.appendChild(button('Ver la carta', next));
      scene.appendChild(card);
    }
    else if (step >= 2 && step < MAIO) {
      const o = carta[step - 2];
      setBg('barra');
      const card = el('div', 'card');
      const pic = img(o.pic, 'pic');
      card.appendChild(pic);
      card.appendChild(el('div', 'counter', `${step - 1} / ${carta.length}`));
      card.appendChild(el('div', 'eu', o.eu));
      card.appendChild(el('div', 'es', o.es));
      const ocupado = o.solo && puestos > 0;
      card.appendChild(el('p', 'note', ocupado ? 'Es tradición, pero va solo. Con lo que ya pusiste, no.' : o.note));
      const choices = el('div', 'choices');
      if (ocupado) {
        choices.appendChild(button('Ez, claro', () => { if (!busy) next(); }, 'ez'));
        card.appendChild(choices);
        scene.appendChild(card);
        return;
      }
      const bai = button('Bai', () => {
        if (busy) return; busy = true;
        bai.disabled = true; ez.disabled = true;
        const idx = puestos++;
        volar(pic, { w: o.w, cx: 0.5, bottom: 0.58 - idx * 0.03 }, null, () => {
          ponerIngrediente(o, idx);
          setTimeout(() => { busy = false; next(); }, 520);
        });
      }, 'bai');
      const ez = button('Ez', () => { if (!busy) next(); }, 'ez');
      choices.appendChild(bai); choices.appendChild(ez);
      card.appendChild(choices);
      scene.appendChild(card);
    }
    else if (step === MAIO) {
      setBg('barra');
      const card = el('div', 'card');
      const pic = img(IMG.maionesa, 'pic');
      card.appendChild(pic);
      card.appendChild(el('div', 'counter', 'Y para terminar…'));
      card.appendChild(el('div', 'eu', 'Maionesa?'));
      card.appendChild(el('div', 'es', '¿Mayonesa?'));
      card.appendChild(el('p', 'note', 'Le va a todo.'));
      const choices = el('div', 'choices');
      let escapes = 0, hueco = null;
      const siBai = () => {
        if (busy) return; busy = true;
        bai.disabled = true; ez.disabled = true; ez.remove(); if (hueco) hueco.remove();
        // cae sobre lo que haya adentro: cuanto más lleno el talo, más arriba
        const tope = 40 + puestos * 3;
        splash.style.bottom = tope + '%';
        volar(pic, { w: 0.26, cx: 0.5, bottom: 1.0 - tope / 100 }, 'rotate(-150deg)', () => {
          splash.classList.add('on');
          talo.classList.remove('bump'); void talo.offsetWidth; talo.classList.add('bump');
          splashSound();
          vibra([120, 60, 160]);
          setTimeout(() => { notif.classList.add('on'); vibra([200, 100, 200]); }, 1700);
          setTimeout(() => { busy = false; next(); }, 3600);
          setTimeout(() => notif.classList.remove('on'), 7500);
        });
      };
      const bai = button('Bai', siBai, 'bai');
      const ez = button('Ez', () => {}, 'ez');
      // El "Ez" se escapa apenas lo tocás (o apenas te acercás con el mouse).
      const escapar = (e) => {
        if (busy || ez.classList.contains('rendido')) return;
        if (e.type === 'pointerover' && e.pointerType !== 'mouse') return;
        e.preventDefault();
        escapes++;
        if (!ez.classList.contains('loose')) {
          const r = ez.getBoundingClientRect();
          hueco = el('span', 'btn ez', 'Ez'); hueco.style.visibility = 'hidden';
          ez.replaceWith(hueco); // deja el hueco en la tarjeta
          ez.classList.add('loose');
          ez.style.left = r.left + 'px'; ez.style.top = r.top + 'px';
          document.body.appendChild(ez); // fuera de la tarjeta, para que "fixed" sea fixed de verdad
        }
        const W = window.innerWidth, H = window.innerHeight;
        const w = ez.offsetWidth, h = ez.offsetHeight;
        const cur = ez.getBoundingClientRect();
        let x, y, tries = 0;
        do {
          x = 12 + Math.random() * (W - w - 24);
          y = 12 + Math.random() * (H - h - 24);
          tries++;
        } while (tries < 12 && Math.hypot(x - cur.left, y - cur.top) < Math.min(W, H) * 0.3);
        ez.style.left = x + 'px'; ez.style.top = y + 'px';
        bip();
        if (escapes === 3) ez.classList.add('small');
        if (escapes === 5) ez.classList.add('tiny');
        if (escapes >= 5) { // se cansa, se rinde y vuelve a su lugar, pero ya no dice lo mismo
          ez.classList.add('rendido');
          ez.classList.remove('ez', 'loose', 'small', 'tiny'); ez.classList.add('bai');
          ez.style.left = ''; ez.style.top = '';
          ez.textContent = 'Bai';
          hueco.replaceWith(ez);
          ez.addEventListener('click', siBai);
        }
      };
      ez.addEventListener('pointerdown', escapar);
      ez.addEventListener('pointerover', escapar);
      choices.appendChild(bai); choices.appendChild(ez);
      card.appendChild(choices);
      scene.appendChild(card);
    }
    else { // el final
      setBg('barra');
      const card = el('div', 'card solo finale');
      if (conTxokolatea) { // el talo de chocolate zafa
        card.appendChild(el('div', 'counter', 'Última palabra'));
        card.appendChild(el('div', 'eu', 'Txokolatea'));
        card.appendChild(el('div', 'es', 'Chocolate.'));
        card.appendChild(el('p', 'remate', 'Hoy zafaste de la mayonesa.'));
      } else {
        card.appendChild(el('div', 'counter', 'Última palabra'));
        card.appendChild(el('div', 'eu', 'Patata frijituak'));
        card.appendChild(el('div', 'es', 'Papas fritas.'));
        card.appendChild(el('p', 'remate', 'Creo que la mayonesa era para las papas.'));
      }
      card.appendChild(button(conTxokolatea ? 'Pedir otro' : 'Pedir otro (sin mayonesa, dale)', () => {
        fill.innerHTML = ''; splash.classList.remove('on'); puestos = 0; conTxokolatea = false;
        step = 0; render();
      }));
      const links = el('p', 'links', '¿Todavía no subiste al monte? <a href="https://jtersoli.github.io/mendira/">Lección 1: Mendira!</a>');
      card.appendChild(links);
      scene.appendChild(card);
    }
  }

  function next() {
    if (busy) return;
    if (step < FINAL) { step++; }
    if (step === MAIO && conTxokolatea) step = FINAL; // sin mayonesa: se salta la pregunta
    render();
  }

  document.addEventListener('keydown', (e) => {
    let b = null;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') b = stage.querySelector('.btn.bai') || stage.querySelector('.btn');
    else if (e.key === 'ArrowLeft' || e.key === 'Escape') b = stage.querySelector('.btn.ez');
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  });

  // Precargar todo para que los cambios sean instantáneos
  Object.values(IMG).concat(carta.map(o => o.pic), ['assets/taloa.png', 'assets/maionesa-splash.png'])
    .forEach(src => { const i = new Image(); i.src = src; });

  render();
})();
</script>
</body>
</html>
